name: Publish MP-SPDZ TEE CRG
on:
  push:
    tags:
      - "mp-spdz-tee-v[0-9]+.[0-9]+.[0-9]+"
env:
  REGISTRY: ghcr.io
  WORKING_DIRECTORY: klyshko-mp-spdz-tee
  PREDICATE_TYPE: https://carbynestack.io/attestations/gramine-sgx-measurements/v1
jobs:
  publish:
    runs-on: ubuntu-22.04
    environment: release            # gives access to AUTHOR_KEY_PEM and EXPECTED_MR_SIGNER
    permissions:
      contents: write               # update GitHub release with license obligations
      packages: write               # push to ghcr.io
      id-token: write               # Cosign keyless signing (GitHub OIDC)
    steps:
      - name: Set image name (registry paths must be lowercase)
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY_OWNER,,}/klyshko-mp-spdz-tee" >> "$GITHUB_ENV"
        
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Retrieve license obligation resources
        id: license-obligations
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          cd 3RD-PARTY-LICENSES
          FILES=$(find . -maxdepth 1 -type d -not -path .)
          if [ -n "$FILES" ]
          then
            echo "${FILES}" | zip -r@ 3rd-party-copyrights
          fi
          find . -iname origin.src | \
          awk '{ \
          split($0,b,"/"); \
          system("xargs < " $0 " curl --create-dirs -Lo ./sources/" b[2] ".zip " $2)}' && \
          find -regex './sources$' | awk '{system("zip -jr ./3rd-party-sources.zip " $0)}'
          mkdir -p ../license-obligations
          ARCHIVES=$(find . -regex "^./3rd-party-.*.zip$")
          OBLIGATIONS_FOUND="false"
          if [ -n "$ARCHIVES" ]
          then
            mv $(echo "${ARCHIVES}") ../license-obligations/
            OBLIGATIONS_FOUND="true"
          fi
          echo "OBLIGATIONS_FOUND=${OBLIGATIONS_FOUND}" >> $GITHUB_OUTPUT
      - name: Update Release with license obligations resources
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        if: steps.license-obligations.outputs.OBLIGATIONS_FOUND == 'true'
        with:
          allowUpdates: true
          artifacts: ${{ env.WORKING_DIRECTORY }}/license-obligations/*
          artifactErrorsFailBuild: true
          makeLatest: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0
      - name: Install Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Log in to container registry
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@818d4b7b91585d195f67373fd9cb0332e31a7175 # v4.6.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=match,pattern=mp-spdz-tee-v(\d+.\d+.\d+),group=1

      - name: Prepare author key (outside the build context)
        env:
          AUTHOR_KEY_PEM: ${{ secrets.AUTHOR_KEY_PEM }}
        run: |
          umask 077
          printf '%s\n' "$AUTHOR_KEY_PEM" > "$RUNNER_TEMP/enclave-key.pem"
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@1104d471370f9806843c095c1db02b5a90c5f8b6 # v3.3.1
        with:
          context: ${{ env.WORKING_DIRECTORY }}
          file: ${{ env.WORKING_DIRECTORY }}/Dockerfile.tee-fake-offline
          push: true
          no-cache: true            # never reuse layers signed with a CI throwaway key
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          secret-files: |
            enclave_key=${{ runner.temp }}/enclave-key.pem
      - name: Remove author key from runner
        if: always()
        run: shred -u "$RUNNER_TEMP/enclave-key.pem" 2>/dev/null || rm -f "$RUNNER_TEMP/enclave-key.pem"

      - name: Extract and check enclave measurements from the pushed image
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}
          EXPECTED_MR_SIGNER: ${{ vars.EXPECTED_MR_SIGNER }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint gramine-sgx-sigstruct-view "$IMAGE_REF" \
            --verbose --output-format=json server.sig > sigstruct.json
          cat sigstruct.json
          ACTUAL=$(jq -r .mr_signer sigstruct.json)
          if [ "$ACTUAL" != "$EXPECTED_MR_SIGNER" ]; then
            echo "::error::MR_SIGNER mismatch (got $ACTUAL, expected $EXPECTED_MR_SIGNER). Image will NOT be signed."
            exit 1
          fi
          if ! jq -e '.debug_enclave == false' sigstruct.json > /dev/null; then
            echo "::error::Enclave is built in debug mode. Image will NOT be signed."
            exit 1
          fi
          jq --arg repo "$GITHUB_REPOSITORY" --arg commit "$GITHUB_SHA" --arg ref "$GITHUB_REF" '{
              measurements: { type: "gramine-sgx", mr_enclave, mr_signer, isv_prod_id, isv_svn, debug_enclave },
              source: { repository: $repo, commit: $commit, ref: $ref }
            }' sigstruct.json > predicate.json
          cat predicate.json

      - name: Sign the container image (keyless)
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}
      - name: Attach signed measurement attestation
        run: |
          cosign attest --yes --type "$PREDICATE_TYPE" --predicate predicate.json \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}

      - name: Write job summary
        run: |
          {
            echo "### Published ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
            echo "Digest: \`${{ steps.build-and-push.outputs.digest }}\`"
            echo '```json'; cat predicate.json; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"