apiVersion: v1
kind: Service
metadata:
  name: klyshko-svc
  labels:
    app: gramine-mpspdz-tee-remote
  annotations: 
    service.beta.kubernetes.io/port_5000_no_probe_rule : "true"
spec:
  type: LoadBalancer
  ports:
  - port: 5000           # External port to expose
    targetPort: 5000     # Port on the pods the traffic will be forwarded to
    protocol: TCP
  selector:
    app: gramine-mpspdz-tee-remote         # Ensures this service targets pods with the same label
